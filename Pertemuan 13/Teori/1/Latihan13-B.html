<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <div class="container">
        <form id="bookForm">
            <input type="text" id="judul" placeholder="Judul Buku">
            <input type="text" id="penulis" placeholder="Nama Penulis">
            <input type="text" id="tahun" placeholder="Tahun Penerbit">
            <select id="status">
                <option value="">--Pilih Status--</option>
                <option value="Belum Dibaca">Belum Dibaca</option>
                <option value="Sudah Dibaca">Sudah Dibaca</option>
            </select>
            <button type="submit">Tambah Buku</button>
        </form>
        <div id="bookList"></div>
    </div>

    <script>
        const bookForm = document.getElementById("bookForm");
        const bookList = document.getElementById("bookList");
        let books = [];

        const savedBooks = localStorage.getItem("books");
        if (savedBooks !== null) {
            books = JSON.parse(savedBooks);
        }

        function simpanKeStorage() {
            const jsonBooks = JSON.stringify(books);
            localStorage.setItem("books", jsonBooks);
        }

        function renderBuku() {
            bookList.innerHTML = "";

            if (books.length == 0) {
                bookList.innerHTML = `<div class="empty">Belum Ada Buku</div>`;
                return;
            }

            for(let i=0; i<books.length; i++) {
                const buku = books[i];
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <div class="book-info">
                        <h3>${buku.judul}</h3>
                        <p>Penulis: ${buku.penulis}</p>
                        <p>Tahun: ${buku.tahun}</p>
                        <p>Status: ${buku.status}</p>
                    </div>
                    <button class="delete-btn" onclick="hapusBuku(${buku.idx})">Hapus</button>
                `;
                bookList.appendChild(card);
            }
        }

        bookForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const bukuBaru = {
                idx : books.length, 
                judul : document.getElementById("judul").value,
                penulis : document.getElementById("penulis").value,
                tahun : document.getElementById("tahun").value,
                status : document.getElementById("status").value
            };
            books.push(bukuBaru);
            simpanKeStorage();
            bookForm.reset();
            renderBuku();
        });

        function hapusBuku(idx) {
            if (confirm("Apakah Anda yakin mau menghapus buku ini?")) {
                books.splice(idx, 1);

                simpanKeStorage();
                renderBuku();
            }
        }
        
        renderBuku();
    </script>
</body>
</html>
