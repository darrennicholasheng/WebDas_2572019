<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan</title>
</head>

<style>
    * {
        margin : 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: grid;
        grid-template-areas: 
        "sidebar header" 
        "sidebar main-content";
        grid-template-columns: 200px 1fr;
        grid-template-rows: 50px 1fr;
    }

    .sidebar {
        grid-area: sidebar;
        background-color: rgb(52, 58, 64);
        color: white;
        height: 100vh;
        padding: 10px;
    }

    .sidebar h2 {
        padding: 10px;
        text-align: center;
    }

    .menu {
        display: flex;
        flex-direction: column;
        padding-top: 10px;
        margin: 0 5px;
    }

    .menu a {
        text-decoration: none;
        color: white;
        padding: 10px;
    }
    
    .menu a:hover {
        background-color: rgb(74, 76, 78);
    }

    .header {
        grid-area: header;
        background-color: rgb(0, 122, 255);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
    }

    .user-info {
        display: flex;
        align-items: center;
        padding: 0 5px;
    }

    .user-info img {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        padding: 5px;
    }

    h2 {
        font-size: 20px;
    }

    .main-content {
        grid-area: main-content;
    }

    .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .card-container :hover {
        transform: translateY(-5px);
        transition: transform 0.3s;
    }

    .card {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        padding: 10px;
    }

    .card h3{
        margin-bottom: 10px;
    }
    

    .card p {
        color: rgb(0, 122, 255);
        font-weight: bold;
    }
    
    .btn-lgt {
        background-color: rgb(220, 53, 69);
        color: white;
        width: 100%;
        margin-top: auto;
        cursor: pointer;
        padding: 10px;
    }

    .btn-lgt:hover {
        background-color: rgb(216, 37, 55);
    }

    @media only screen and (max-width: 500px) {
        body {
            grid-template-columns: 1fr;
            grid-template-areas: 
            "header" 
            "main-content";
        }

        .sidebar {
            display: none;
        }
    }
</style>

<body>  

<div class="sidebar">
    <h2>Information System</h2>
    <div class="menu">
        <a href="#">Dashboard</a>
        <a href="#">Laporan</a>
        <a href="#">Pengguna</a>
        <a href="#">Pengaturan</a>
    </div>
    <button class="btn-lgt">Logout</button>
</div>

<div class="header">
    <h1>Dashboard</h1>
    <div class="user-info">
        <span>Admin</span>
        <img src="user.png" alt="user"> 
    </div>
</div>

<div class="main-content">
    <h2>Ringkasan</h2>
    <div class="card-container">
        
        <div class="card">
            <h3>Total Pengguna</h3>
            <p>1,275</p>
        </div>
        
        <div class="card">
            <h3>Penjualan Bulan Ini</h3>
            <p>Rp 150,151,152</p>
        </div>
        
        <div class="card">
            <h3>Ticket Support</h3>
            <p>23</p>
        </div>
        
        <div class="card">
            <h3>Feedback</h3>
            <p>420</p>
        </div>
    
    </div>
</div>
</body>
</html>
