<!DOCTYPE html>
<html>
<head>
    <style>
        div {
            width: 100px;
            height: 100px;
            
            background-color: red;
            transition: width 2s, height 4s, background-color 3s;
        }
        div:hover {
            width: 300px;
            height: 300px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <h1>The transition Property</h1>
    <div></div>
</body>
</html>
