<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-2572019</title>
    <style>
        body {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scoreboard {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .game-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .hand {
            font-size: 100px;
            margin: 10px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        .button-container button {
            font-size: 2rem;
            padding: 10px 20px;
            cursor: pointer;
        }

        .result {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 20px;
        }

        p {
            font-weight: bold;
            font-size: 30px;
            font-family: Arial;
        }

        button {
            padding : 5px;
            margin: 10px;   
        }

        .kotak {
            border: 1px solid #000;
            padding: 20px;
            margin-top: 200px;
            background-color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class ="container">
        <div class="scoreboard">
            <p><span id="player-score">0</span> - <span id="bot-score">0</span></p>
        </div>

        <div class="game-display">
            <div class="hand" id="player-hand"></div>
            <div class="hand" id="bot-hand"></div>

            <div class = "button-container">
                <button onclick="play('batu')">🪨</button>
                <button onclick="play('kertas')">📃</button>
                <button onclick="play('gunting')">✂️</button>
            </div>
        </div>  

        <div class="result">
            <p id="result"></p>
        </div>
    </div>
    
    <script>
        var playerScore = 0
        var botScore = 0

        function play(playerChoice) {
            const choices = ['batu', 'kertas', 'gunting'];
            const botChoice = choices[Math.floor(Math.random() * 3)];

            document.getElementById('player-hand').src = `assets/${playerChoice}.png`;
            document.getElementById('bot-hand').src = `assets/${botChoice}.png`;

            const resultlabel = document.getElementById('result');

            if (playerChoice === botChoice) {
                resultlabel.innerText = "DRAW!";
            } else if (
                (playerChoice === 'batu' && botChoice === 'gunting') ||
                (playerChoice === 'kertas' && botChoice === 'batu') ||
                (playerChoice === 'gunting' && botChoice === 'kertas')
            ) {
                playerScore++;
                resultlabel.innerText = "PLAYER WIN!";
            } else {
                botScore++;
                resultlabel.innerText = "BOT WIN!";
            }

            document.getElementById('player-score').innerText = playerScore;
            document.getElementById('bot-score').innerText = botScore;
        }
    </script>

</body>
</html>
