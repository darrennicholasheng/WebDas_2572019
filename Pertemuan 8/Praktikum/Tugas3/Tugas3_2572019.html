<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenRGB-2572019</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .card {
            align-items: center;
            text-align: center;
            padding: 10px;
            border-radius: 7px;
            background-color: white;
            box-shadow: 2;
            padding: 50px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .rgb-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .rgb-input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        #counter {
            font-size: 40px;
            font-weight: bold;
            margin: 5px;
            padding: 10px;
        }

        .btn-reset {
            width: 100%;
            margin-top: 10px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }

        .display-area {
            margin: 20px 0;
            border: #eee solid 1px;
            padding: 10px;
            border-radius: 5px;
        }

    </style>
</head>
<body>

    <div class="card">
        <h1>RGB Control Panel</h1>

        <div class="rgb-group">
            <input type="number" id="r" class="rgb-input" placeholder="R" min="0" max="255">
            <input type="number" id="g" class="rgb-input" placeholder="G" min="0" max="255">
            <input type="number" id="b" class="rgb-input" placeholder="B" min="0" max="255">
        </div>

        <div class="btn-container">
            <button class="btn-submit" onclick="updateWarna()">Terapkan</button>
            <button class="btn-random" onclick="acakWarna()">Acak Warna</button>
        </div>

        <div class="display-area">
            <div>Skor Saat Ini:</div>
            <div id="counter">0</div>
        </div>

        <div class="btn-container">
            <button class="btn-add" onclick="tambahSkor()">Tambah (+1)</button>
            <button class="btn-remove" onclick="kurangiSkor()">Kurang (-1)</button>
        </div>

        <button class="btn-reset" onclick="resetSkor()">Reset Ke Default</button>

        <div class="footer">
            <strong>&copy; 2026 [2572019] - [Darren Nicholas Heng]. All rights reserved.</strong>
        </div>
    </div>

    <script>
        var skor = 0;
        function updateWarna() {
            var r = document.getElementById("r").value;
            var g = document.getElementById("g").value;
            var b = document.getElementById("b").value;

            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

        function acakWarna() {
            var r = Math.floor(Math.random() * 256);
            var g = Math.floor(Math.random() * 256);
            var b = Math.floor(Math.random() * 256);

            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }


        function tambahSkor() {
            skor++;
            document.getElementById("counter").textContent = skor;
        }

        function kurangiSkor() {
            skor--;
            document.getElementById("counter").textContent = skor;
        }

        function resetSkor() {
            skor = 0;
            var r = document.getElementById("r").value || 255;
            var g = document.getElementById("g").value || 255;
            var b = document.getElementById("b").value || 255;
            document.getElementById("counter").textContent = skor;
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }
    </script>
</body>
</html>
